<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" width="400" height="130" role="img" aria-label="Releaf" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Releaf</title>
  <defs>
    <!-- Маска: вирізає пін із листка -->
    <mask id="pin-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#ffffff"/>
      <path d="M62 28 C 48 28 40 38 40 49 C 40 64 62 84 62 84 C 62 84 84 64 84 49 C 84 38 76 28 62 28 Z" fill="#000000"/>
    </mask>
  </defs>

  <!-- Знак: листок із піном -->
  <g transform="translate(0,5)">
    <g mask="url(#pin-cutout)">
      <path d="M20 100 C 8 50, 50 8, 108 10 Z" fill="#5DB86A"/>
      <path d="M108 10 C 112 70, 80 112, 20 100 Z" fill="#8FD19A"/>
    </g>
    <circle cx="62" cy="49" r="8" fill="#E8553D"/>
  </g>

  <!-- Назва -->
  <text x="135" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="#EAF4EC">Re<tspan fill="#5DB86A">leaf</tspan></text>
</svg>
