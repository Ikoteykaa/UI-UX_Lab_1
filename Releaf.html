<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Releaf — Про застосунок</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <input type="checkbox" id="theme" class="theme-check" />
    <div class="app">
      <label for="theme" class="theme-btn">◐ Тема</label>

      <div class="splash">
        <img
          class="splash__logo logo-light"
          src="logo.svg"
          alt="Логотип Releaf"
        />
        <img
          class="splash__logo logo-dark"
          src="logo-dark.svg"
          alt="Логотип Releaf"
        />
        <div class="splash__bar">
          <div class="splash__fill"></div>
        </div>
      </div>

      <main class="main">
        <section class="card">
          <img
            class="card__logo logo-light"
            src="logo.svg"
            alt="Логотип Releaf"
          />
          <img
            class="card__logo logo-dark"
            src="logo-dark.svg"
            alt="Логотип Releaf"
          />

          <h1>Про застосунок</h1>
          <p class="card__desc">
            Releaf — платформа віртуального лісу. Ти садиш дерево на сайті, воно
            з'являється у твоєму цифровому лісі, а партнери садять справжнє.
          </p>

          <ul class="info">
            <li><span>Назва</span><b>Releaf</b></li>
            <li><span>Версія</span><b>1.0.0</b></li>
            <li><span>Автор</span><b>Кіндєєва А. О.</b></li>
            <li><span>Рік</span><b>2026</b></li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
